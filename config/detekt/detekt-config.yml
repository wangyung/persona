# The project builds upon the default detekt config (buildUponDefaultConfig is enabled in
# gradle/detekt.gradle). Only the project specific overrides are declared here.
build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true
  exclude:
    - 'DetektProgressListener'

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'
    - 'FileBasedFindingsReport'

# The Composable functions are PascalCase and tend to be long, don't apply the naming and
# complexity rules for them.
complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
    # The demo app is full of the animation coordinates and parameters, don't apply the rule
    # for it.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/com/github/wangyung/app/**'
